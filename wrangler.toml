name = "sde-cloudflare-store"
main = "src/index.ts"
compatibility_date = "2026-09-21"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "sde-store-db"
database_id = "fbcf0564-1b26-4793-8a3c-fec591d8da74"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "sde-product-images"

[vars]
# Change these in Cloudflare Dashboard > Workers & Pages > Settings > Variables.
# ADMIN_PASSWORD = "Admin_01"
# ADMIN_SESSION_SECRET = "P@ssw0rd"

# Optional. The worker serves images through /media/:key, so no public R2 bucket is required.
